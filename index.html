
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Our Museum</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/museum.css">
<link rel="stylesheet" href="css/controls.css">
<link rel="stylesheet" href="css/popup.css">

</head>
<body>

<div id="scene"></div>
<div id="title">Our Museum</div>
<div id="hint">Explore our memories</div>

<button id="uploadBtn">＋ Add Photos</button>
<button id="galleryBtn">Gallery</button>

<div id="controls">
  <div id="stick"><div id="knob"></div></div>
    <button id="forward">↑</button>
    </div>

    <div id="popup">
      <div id="popupbox">
          <h2 id="ptitle">Memory</h2>
              <img id="pimage" src="" alt="Memory">
                  <p id="ptext"></p>
                      <button id="close">Close</button>
                        </div>
                        </div>

                        <div id="uploadPanel">
                          <div id="panelBox">
                              <h2>My Museum Photos</h2>
                                  <p>Add multiple photos. Name is optional.</p>
                                      <input id="fileInput" type="file" accept="image/*" multiple>
                                          <p id="status">Choose your photos.</p>
                                              <div id="photoList"></div>
                                                  <button id="panelClose">Close</button>
                                                    </div>
                                                    </div>

                                                    <script type="module" src="js/main.js"></script>
                                                    </body>
                                                    </html>
